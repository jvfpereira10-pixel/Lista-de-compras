<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <span id="logo">
        <img src="assets/logo.png" alt="">
        <h1>quicklist</h1>
    </span>
    
    <main>
       
       <div class="main" id="content">
           
           <a href="#"><- Voltar</a>
           <h2>Compras da semana</h2>

           <form action="">
                
                
                <input type="text" required id="item" class="item-input" placeholder="Adicione um novo item"><button id="add-btn" type="">Adicionar item</button>
           
                <ul class="list-compras">
                    <li class="itens-li">
                        <label>
                            <input type="checkbox">
                            <span>Pão de forma</span>
                        </label>
                        <button class="btn-remover">🗑</button>
                    </li>
                   
                    <li class="itens-li">
                        <label>
                            <input type="checkbox">
                            <span>Café preto</span>
                        </label>
                        <button class="btn-remover">🗑</button>
                    </li>
                    
                    <li class="itens-li">
                        <label>
                            <input type="checkbox">
                            <span>Suco de laranja</span>
                        </label>
                        <button class="btn-remover">🗑</button>
                    </li>
                    
                    <li class="itens-li">
                        <label>
                            <input type="checkbox">
                            <span>Bolacha</span>
                        </label>
                        <button class="btn-remover">🗑</button>
                    </li>
                
                </ul>
        
            </form>
       
            <div class="item-removed">
                <span>⚠️  O item foi removido</span>
                <button class="remove-notification">X</button>
            </div>
       
        </div>
    
    </main>
    
    
    
    
    
    
    <script src="scripts.js"></script>
</body>
</html>
